<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Veron Store CRM</title>
    <style>
        :root {
            --bg-color: #0b1516; /* Verde muy oscuro/negro de tu logo */
            --card-color: #142325;
            --gold: #d4af37; /* Dorado */
            --copper: #b87333; /* Cobre */
            --text-color: #f5f5f5;
        }
        body {
            font-family: 'Arial', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid var(--gold);
            padding-bottom: 20px;
        }
        .header h1 {
            font-family: 'Georgia', serif; /* Estilo de tu logo */
            color: var(--gold);
            font-size: 2.5em;
            margin: 0;
            letter-spacing: 2px;
        }
        .container {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
        }
        .card {
            background-color: var(--card-color);
            border: 1px solid var(--copper);
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }
        h2 { color: var(--copper); font-size: 1.2em; }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            background-color: #0b1516;
            border: 1px solid #333;
            color: white;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            background: linear-gradient(45deg, var(--copper), var(--gold));
            color: black;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            width: 100%;
            text-transform: uppercase;
        }
        button:hover { opacity: 0.8; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #333;
        }
        th { color: var(--gold); }
        .status-badge {
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 0.8em;
            font-weight: bold;
        }
        .status-Nuevo { background-color: #3498db; color: white; }
        .status-Negociando { background-color: #f1c40f; color: black; }
        .status-Ganado { background-color: #2ecc71; color: black; }
    </style>
</head>
<body>

    <div class="header">
        <h1>VERON STORE</h1>
        <p>Sistema de Gestión de Clientes (CRM)</p>
    </div>

    <div class="container">
        <!-- Formulario para agregar cliente -->
        <div class="card">
            <h2>Registrar Nuevo Cliente (Desde Meta)</h2>
            <form action="/add" method="POST">
                <input type="text" name="nombre" placeholder="Nombre del cliente" required>
                <select name="red_social">
                    <option value="Instagram">Instagram</option>
                    <option value="Facebook">Facebook</option>
                    <option value="WhatsApp">WhatsApp</option>
                </select>
                <input type="text" name="producto_interes" placeholder="Producto de interés (Ej: Ventilador, Juguete)">
                <textarea name="notas" placeholder="Notas adicionales (Ej: Pidió precio, quiere color negro)"></textarea>
                <button type="submit">Guardar Cliente</button>
            </form>
        </div>

        <!-- Tabla de clientes -->
        <div class="card">
            <h2>Mis Clientes (Leads)</h2>
            <table>
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Red Social</th>
                        <th>Interés</th>
                        <th>Estado</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody>
                    {% for cliente in clientes %}
                    <tr>
                        <td>{{ cliente.nombre }}</td>
                        <td>{{ cliente.red_social }}</td>
                        <td>{{ cliente.producto_interes }}</td>
                        <td>
                            <span class="status-badge status-{{ cliente.estado.split(' ')[0] }}">
                                {{ cliente.estado }}
                            </span>
                        </td>
                        <td>
                            <form action="/update_status/{{ cliente.id }}" method="POST" style="display:flex; gap:5px;">
                                <select name="estado" style="margin:0; padding:5px;">
                                    <option value="Nuevo Lead">Nuevo Lead</option>
                                    <option value="Negociando">Negociando</option>
                                    <option value="Ganado">Ganado</option>
                                    <option value="Perdido">Perdido</option>
                                </select>
                                <button type="submit" style="width:auto; padding:5px 10px;">✓</button>
                            </form>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>

</body>
</html>
